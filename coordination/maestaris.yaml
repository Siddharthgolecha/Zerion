schema: 1
mode: chat-first

repository: Siddharthgolecha/Maestaris
default_branch: main

tasks:
  label: maestaris:task
  priority_labels:
    - priority:P0
    - priority:P1
    - priority:P2

claims:
  active_hours: 4
  workers:
    - A
    - B

branches:
  prefix: maestaris/

execution:
  interactive_chats_are_primary: true
  scheduled_runs_required: false
  external_executor_required: false

principles:
  - do_project_work_before_orchestration_work
  - prefer_github_native_state
  - keep_claims_lightweight
  - avoid_duplicate_worker_effort
  - preserve_tests_and_review
  - never_commit_secrets
